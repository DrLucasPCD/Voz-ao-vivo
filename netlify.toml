[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

# Mantém o fluxo de autenticação Firebase no mesmo domínio em navegadores móveis.
[[redirects]]
  from = "/__/auth/*"
  to = "https://voz-ao-vivo.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "microphone=(self), on-device-speech-recognition=(self)"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
